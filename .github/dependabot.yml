version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # vitest >= 4 requires Node >= 20.0.0 and vitest >= 5 requires Node >= 22.12.0; x402-avm-js supports Node >= 20 and tests Node 20/22/24 in CI; keep vitest on 3.x
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
