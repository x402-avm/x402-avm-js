name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Offline Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run tests/unit.test.ts

  localnet:
    name: LocalNet Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install --upgrade pip ai-economy-sdk x402-algorand
      - name: Install AlgoKit and start LocalNet
        run: |
          pipx install algokit
          algokit localnet start
          for i in {1..30}; do
            if curl -s http://localhost:4001/health; then
              echo "LocalNet is ready"
              break
            fi
            sleep 1
          done
      - run: npm ci
      - name: Run LocalNet golden tests
        run: LOCALNET=1 npx vitest run tests/golden.test.ts tests/golden_asa.test.ts

  public-networks:
    name: Public Networks Simulation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run public networks simulation tests
        run: PUBLIC_NETS=1 npx vitest run tests/networks.test.ts

  build:
    name: Build & Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
